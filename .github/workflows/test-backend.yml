name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: docker compose -f compose.infra.yml down -v --remove-orphans
      - run: docker compose -f compose.infra.yml up -d --wait db
      - name: Migrate DB
        run: uv run bash docker/api/scripts/prestart.sh
      # 测试库刷新脚本随 db 服务挂载（原 test-db-prepare 服务已移除）
      - name: Prepare isolated test database
        run: docker compose -f compose.infra.yml exec -T db sh /usr/local/bin/prepare-test-database
      - name: Run tests
        run: uv run bash docker/api/scripts/tests-start.sh "Coverage for ${{ github.sha }}"
      - run: docker compose -f compose.infra.yml down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov
          include-hidden-files: true
      - name: Coverage report
        run: uv run coverage report --fail-under=90
