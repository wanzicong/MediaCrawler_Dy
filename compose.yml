services:
  prestart:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG:-latest}'
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: bash docker/api/scripts/prestart.sh
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
    volumes:
      # 结构化业务默认值：只读挂载，容器内路径与仓库根一致（BASE_DIR=/app）
      - ./config.yaml:/app/config.yaml:ro

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG:-latest}'
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      MEDIA_STORAGE_BACKEND: minio
      MEDIA_OUTPUT_DIR: /app/data/media
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      DOUYIN_BROWSER_MODE: remote
      DOUYIN_REMOTE_CDP_HOST: douyin-browser
      DOUYIN_REMOTE_CDP_PORT: "9222"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    volumes:
      - crawler-data:/app/data
      - crawler-browser-data:/app/browser_data
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG:-latest}'
    restart: unless-stopped
    command: ["python", "-m", "crawler.mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8766", "--allowed-host", "localhost:*", "--allowed-host", "127.0.0.1:*"]
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      MCP_API_BASE_URL: http://backend:8000/api/v1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8766:8766"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8766), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG:-latest}'
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

  douyin-browser:
    image: mediacrawler-dy/browser:local
    profiles: ["crawler"]
    build:
      context: ./docker/browser
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: 2gb
    environment: &browser-no-proxy
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    volumes:
      - douyin-browser-profile:/profile
    ports:
      - "127.0.0.1:9223:9222"
      - "127.0.0.1:6081:6080"

  douyin-browser-1:
    image: mediacrawler-dy/browser:local
    profiles: ["crawler"]
    restart: unless-stopped
    shm_size: 2gb
    environment: *browser-no-proxy
    volumes:
      - douyin-browser-profile-1:/profile
    ports:
      - "127.0.0.1:9224:9222"
      - "127.0.0.1:6082:6080"

  douyin-browser-2:
    image: mediacrawler-dy/browser:local
    profiles: ["crawler"]
    restart: unless-stopped
    shm_size: 2gb
    environment: *browser-no-proxy
    volumes:
      - douyin-browser-profile-2:/profile
    ports:
      - "127.0.0.1:9225:9222"
      - "127.0.0.1:6083:6080"

  douyin-browser-3:
    image: mediacrawler-dy/browser:local
    profiles: ["crawler"]
    restart: unless-stopped
    shm_size: 2gb
    environment: *browser-no-proxy
    volumes:
      - douyin-browser-profile-3:/profile
    ports:
      - "127.0.0.1:9226:9222"
      - "127.0.0.1:6084:6080"

  test-backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG:-latest}'
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    depends_on:
      test-db-prepare:
        condition: service_completed_successfully
    command: bash docker/api/scripts/test-start.sh
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      TESTING: "true"
      ENVIRONMENT: local
      FRONTEND_HOST: http://127.0.0.1:5174
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${TEST_POSTGRES_DB:-app_test}
      MEDIA_STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  playwright:
    profiles: ["test"]
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        VITE_API_URL: http://test-backend:8000
    ipc: host
    depends_on:
      test-backend:
        condition: service_healthy
      mailcatcher:
        condition: service_started
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      PLAYWRIGHT_EXTERNAL_BACKEND: "true"
      PLAYWRIGHT_API_URL: http://test-backend:8000
      VITE_API_URL: http://test-backend:8000
      MAILCATCHER_HOST: http://mailcatcher:1080
      PLAYWRIGHT_HTML_HOST: 0.0.0.0
      CI: ${CI:-}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - "9323:9323"

volumes:
  crawler-data:
  crawler-browser-data:
  douyin-browser-profile:
  douyin-browser-profile-1:
  douyin-browser-profile-2:
  douyin-browser-profile-3:
