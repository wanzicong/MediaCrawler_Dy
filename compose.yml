services:

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    env_file:
      - .env
      - path: .env.local
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export MINIO_ROOT_USER="$${MINIO_ACCESS_KEY}"
        export MINIO_ROOT_PASSWORD="$${MINIO_SECRET_KEY}"
        unset MINIO_ACCESS_KEY MINIO_SECRET_KEY
        exec minio server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - default

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls.certresolver=le
      - traefik.http.services.${STACK_NAME?Variable not set}-adminer.loadbalancer.server.port=8080

  prestart:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - DOUYIN_CDP_HOST=${DOUYIN_CDP_HOST}
      - DOUYIN_CDP_PORT=${DOUYIN_CDP_PORT}
      - DOUYIN_BROWSER_MODE=${DOUYIN_BROWSER_MODE}
      - DOUYIN_CDP_CONNECT_EXISTING=${DOUYIN_CDP_CONNECT_EXISTING}
      - DOUYIN_CDP_CONNECT_TIMEOUT=${DOUYIN_CDP_CONNECT_TIMEOUT}
      - DOUYIN_CDP_BROWSER_PATH=${DOUYIN_CDP_BROWSER_PATH}
      - DOUYIN_CDP_USER_DATA_DIR=${DOUYIN_CDP_USER_DATA_DIR}
      - DOUYIN_CDP_HEADLESS=${DOUYIN_CDP_HEADLESS}
      - DOUYIN_CDP_AUTO_CLOSE=${DOUYIN_CDP_AUTO_CLOSE}
      - DOUYIN_REMOTE_CDP_HOST=${DOUYIN_REMOTE_CDP_HOST}
      - DOUYIN_REMOTE_CDP_PORT=${DOUYIN_REMOTE_CDP_PORT}
      - DOUYIN_LOGIN_TIMEOUT=${DOUYIN_LOGIN_TIMEOUT}
      - DOUYIN_REQUEST_TIMEOUT=${DOUYIN_REQUEST_TIMEOUT}
      - DOUYIN_MAX_ACTIVE_TASKS=${DOUYIN_MAX_ACTIVE_TASKS}
      - DOUYIN_MAX_AWEMES_PER_TASK=${DOUYIN_MAX_AWEMES_PER_TASK}
      - DOUYIN_MAX_COMMENTS_PER_AWEME=${DOUYIN_MAX_COMMENTS_PER_AWEME}
      - DOUYIN_REQUEST_SSL_VERIFY=${DOUYIN_REQUEST_SSL_VERIFY}

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - DOUYIN_CDP_HOST=${DOUYIN_CDP_HOST}
      - DOUYIN_CDP_PORT=${DOUYIN_CDP_PORT}
      - DOUYIN_BROWSER_MODE=${DOUYIN_BROWSER_MODE}
      - DOUYIN_CDP_CONNECT_EXISTING=${DOUYIN_CDP_CONNECT_EXISTING}
      - DOUYIN_CDP_CONNECT_TIMEOUT=${DOUYIN_CDP_CONNECT_TIMEOUT}
      - DOUYIN_CDP_BROWSER_PATH=${DOUYIN_CDP_BROWSER_PATH}
      - DOUYIN_CDP_USER_DATA_DIR=${DOUYIN_CDP_USER_DATA_DIR}
      - DOUYIN_CDP_HEADLESS=${DOUYIN_CDP_HEADLESS}
      - DOUYIN_CDP_AUTO_CLOSE=${DOUYIN_CDP_AUTO_CLOSE}
      - DOUYIN_REMOTE_CDP_HOST=${DOUYIN_REMOTE_CDP_HOST}
      - DOUYIN_REMOTE_CDP_PORT=${DOUYIN_REMOTE_CDP_PORT}
      - DOUYIN_LOGIN_TIMEOUT=${DOUYIN_LOGIN_TIMEOUT}
      - DOUYIN_REQUEST_TIMEOUT=${DOUYIN_REQUEST_TIMEOUT}
      - DOUYIN_MAX_ACTIVE_TASKS=${DOUYIN_MAX_ACTIVE_TASKS}
      - DOUYIN_MAX_AWEMES_PER_TASK=${DOUYIN_MAX_AWEMES_PER_TASK}
      - DOUYIN_MAX_COMMENTS_PER_AWEME=${DOUYIN_MAX_COMMENTS_PER_AWEME}
      - DOUYIN_REQUEST_SSL_VERIFY=${DOUYIN_REQUEST_SSL_VERIFY}
      # 127.0.0.1:9100 is the host-side address. Containers use Docker DNS.
      - MEDIA_STORAGE_BACKEND=minio
      - MINIO_ENDPOINT=minio:9000
      - MINIO_SECURE=false
      # Never pass workstation-only proxy variables into the application.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
      # Keep local media inside the persistent crawler-data volume. Other media
      # settings come from .env/.env.local so secrets are not interpolated here.
      - MEDIA_OUTPUT_DIR=/app/data/media

    volumes:
      - crawler-data:/app/data
      - crawler-browser-data:/app/browser_data
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.middlewares=https-redirect

  mcp:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    command:
      - python
      - -m
      - app.mcp_server
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8766"
      - --allowed-host
      - localhost:*
      - --allowed-host
      - 127.0.0.1:*
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MCP_API_BASE_URL=http://backend:8000/api/v1
      - MCP_API_USERNAME=${MCP_API_USERNAME}
      - MCP_API_PASSWORD=${MCP_API_PASSWORD}
    networks:
      - default
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8766), 2).close()"
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=https://api.${DOMAIN?Variable not set}
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=https-redirect
volumes:
  app-db-data:
  crawler-data:
  crawler-browser-data:
  minio-data:

networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true
