services:
  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG:-latest}'
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    # 迁移与初始数据由 backend 自己在启动前完成（原 prestart 一次性服务已移除）
    command: bash -c "bash docker/api/scripts/prestart.sh && exec fastapi run --workers 1 modules/api/src/crawler/api/main.py"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      MEDIA_STORAGE_BACKEND: minio
      MEDIA_OUTPUT_DIR: /app/data/media
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      # 字幕转写走基础容器里的 whisper（OpenAI 兼容接口，见 compose.infra.yml）
      WHISPER_API_BASE_URL: http://whisper:8000
      DOUYIN_BROWSER_MODE: remote
      DOUYIN_REMOTE_CDP_HOST: douyin-browser
      DOUYIN_REMOTE_CDP_PORT: "9222"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    volumes:
      - crawler-data:/app/data
      - crawler-browser-data:/app/browser_data
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG:-latest}'
    restart: unless-stopped
    command: ["python", "-m", "crawler.mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8766", "--allowed-host", "localhost:*", "--allowed-host", "127.0.0.1:*"]
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      MCP_API_BASE_URL: http://backend:8000/api/v1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8766:8766"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8766), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG:-latest}'
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

volumes:
  crawler-data:
  crawler-browser-data:
