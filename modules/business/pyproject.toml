[project]
name = "crawler-business"
version = "0.1.0"
description = "Business domain: models, use-case services, media pipeline, storage resources."
requires-python = ">=3.10,<4.0"
dependencies = [
    "crawler-bootstrap",
    "crawler-browser",
    "crawler-douyin-client",
    "pydantic>=2.13.4",
    "sqlmodel<1.0.0,>=0.0.21",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "pyjwt<3.0.0,>=2.8.0",
    "minio>=7.2.20,<8.0.0",
    "cryptography>=46.0.0,<51.0.0",
    "emails<1.0,>=0.6",
    "jinja2<4.0.0,>=3.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler"]

[tool.uv.sources]
crawler-bootstrap = { workspace = true }
crawler-browser = { workspace = true }
crawler-douyin-client = { workspace = true }
