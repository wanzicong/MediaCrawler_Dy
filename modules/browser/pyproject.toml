[project]
name = "crawler-browser"
version = "0.1.0"
description = "CDP-only browser runtime: endpoint discovery, sessions, remote slots."
requires-python = ">=3.10,<4.0"
dependencies = [
    "crawler-bootstrap",
    "playwright>=1.61.0,<2.0.0",
    "httpx<1.0.0,>=0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler"]

[tool.uv.sources]
crawler-bootstrap = { workspace = true }
