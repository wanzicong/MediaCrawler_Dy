[project]
name = "crawler-douyin-client"
version = "0.1.0"
description = "Douyin HTTP API client: signing, transport, response parsing, privacy mapping."
requires-python = ">=3.10,<4.0"
dependencies = [
    "httpx<1.0.0,>=0.25.1",
    "PyExecJS==1.5.1",
    "pydantic>2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler"]
