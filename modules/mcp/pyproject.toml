[project]
name = "crawler-mcp"
version = "0.1.0"
description = "MCP gateway proxying the authenticated FastAPI service."
requires-python = ">=3.10,<4.0"
dependencies = [
    "crawler-bootstrap",
    "mcp>=1.12.4,<2.0.0",
    "httpx<1.0.0,>=0.25.1",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler"]

[tool.uv.sources]
crawler-bootstrap = { workspace = true }
