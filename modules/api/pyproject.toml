[project]
name = "crawler-api"
version = "0.1.0"
description = "FastAPI HTTP adapter layer over the business domain."
requires-python = ">=3.10,<4.0"
dependencies = [
    "crawler-business",
    "fastapi[standard]<1.0.0,>=0.114.2",
    "python-multipart<1.0.0,>=0.0.7",
    "sentry-sdk[fastapi]<2.0.0,>=1.40.6",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "sqlmodel<1.0.0,>=0.0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler"]

[tool.uv.sources]
crawler-business = { workspace = true }
crawler-bootstrap = { workspace = true }
crawler-browser = { workspace = true }
crawler-douyin-client = { workspace = true }
