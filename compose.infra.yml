services:
  db:
    image: postgres:18
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
      # 测试库刷新脚本随 db 容器提供：容器自带 pg_dump / pg_restore，无需额外服务
      - ./docker/db/prepare-test-database.sh:/usr/local/bin/prepare-test-database:ro
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB?Variable not set}
      TEST_POSTGRES_DB: ${TEST_POSTGRES_DB:-app_test}

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    env_file:
      - .env
      - path: .env.local
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export MINIO_ROOT_USER="$${MINIO_ACCESS_KEY}"
        export MINIO_ROOT_PASSWORD="$${MINIO_SECRET_KEY}"
        unset MINIO_ACCESS_KEY MINIO_SECRET_KEY
        exec minio server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 浏览器容器属于基础设施：不依赖应用镜像，跟着 `--profile crawler` 起停。
  douyin-browser:
    image: mediacrawler-dy/browser:local
    profiles: ["crawler"]
    build:
      context: ./docker/browser
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: 2gb
    environment: &browser-no-proxy
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    volumes:
      - douyin-browser-profile:/profile
    ports:
      - "127.0.0.1:9223:9222"
      - "127.0.0.1:6081:6080"

  douyin-browser-1:
    image: mediacrawler-dy/browser:local
    profiles: ["crawler"]
    restart: unless-stopped
    shm_size: 2gb
    environment: *browser-no-proxy
    volumes:
      - douyin-browser-profile-1:/profile
    ports:
      - "127.0.0.1:9224:9222"
      - "127.0.0.1:6082:6080"

  douyin-browser-2:
    image: mediacrawler-dy/browser:local
    profiles: ["crawler"]
    restart: unless-stopped
    shm_size: 2gb
    environment: *browser-no-proxy
    volumes:
      - douyin-browser-profile-2:/profile
    ports:
      - "127.0.0.1:9225:9222"
      - "127.0.0.1:6083:6080"

  douyin-browser-3:
    image: mediacrawler-dy/browser:local
    profiles: ["crawler"]
    restart: unless-stopped
    shm_size: 2gb
    environment: *browser-no-proxy
    volumes:
      - douyin-browser-profile-3:/profile
    ports:
      - "127.0.0.1:9226:9222"
      - "127.0.0.1:6084:6080"

volumes:
  app-db-data:
  minio-data:
  douyin-browser-profile:
  douyin-browser-profile-1:
  douyin-browser-profile-2:
  douyin-browser-profile-3:
