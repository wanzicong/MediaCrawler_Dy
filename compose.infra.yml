services:
  db:
    image: postgres:18
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
      # 测试库刷新脚本随 db 容器提供：容器自带 pg_dump / pg_restore，无需额外服务
      - ./docker/db/prepare-test-database.sh:/usr/local/bin/prepare-test-database:ro
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB?Variable not set}
      TEST_POSTGRES_DB: ${TEST_POSTGRES_DB:-app_test}

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    env_file:
      - .env
      - path: .env.local
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export MINIO_ROOT_USER="$${MINIO_ACCESS_KEY}"
        export MINIO_ROOT_PASSWORD="$${MINIO_SECRET_KEY}"
        unset MINIO_ACCESS_KEY MINIO_SECRET_KEY
        exec minio server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 本地语音转文字（faster-whisper，OpenAI 兼容接口）：项目字幕转写走 POST /v1/audio/transcriptions。
  # 默认 CPU 版镜像；有 NVIDIA GPU 时把 WHISPER_IMAGE 换成 ghcr.io/speaches-ai/speaches:latest-cuda，
  # 并把 WHISPER_INFERENCE_DEVICE 设为 cuda、WHISPER_COMPUTE_TYPE 设为 float16。
  whisper:
    image: ${WHISPER_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}
    restart: unless-stopped
    # 该镜像没有「启动时预加载」配置项，进入容器先确保模型已在缓存卷里（已缓存时秒过），再起服务
    command:
      - sh
      - -c
      - |
        set -e
        python -c "import os; from huggingface_hub import snapshot_download; [snapshot_download(m.strip()) for m in os.environ.get('WHISPER_MODELS', '').split(',') if m.strip()]"
        exec uvicorn --factory speaches.main:create_app
    ports:
      # 端口与 config.yaml 的 subtitle.base_url 默认值一致：本机后端无需改配置即可调用
      - "127.0.0.1:${WHISPER_HOST_PORT:-9000}:8000"
    environment:
      WHISPER__INFERENCE_DEVICE: ${WHISPER_INFERENCE_DEVICE:-cpu}
      WHISPER__COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      # CPU 版默认只用约 4 个线程（实测 390% CPU），字幕队列会被它卡住；
      # 这里放开到 8 个线程吃满更多核心（可用 WHISPER_CPU_THREADS 覆盖）。
      WHISPER__CPU_THREADS: ${WHISPER_CPU_THREADS:-8}
      # 字幕任务会连续调用同一模型，常驻内存避免反复加载（-1 表示不因空闲卸载）
      WHISPER__TTL: "-1"
      # 启动时确保这些模型已下载（逗号分隔）：首次启动从 HF_ENDPOINT 下载约 500 MB
      WHISPER_MODELS: ${WHISPER_MODELS:-Systran/faster-whisper-small}
      # 国内网络访问不到 huggingface.co，默认走镜像站下载模型；可覆盖 HF_ENDPOINT
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      # 模型缓存持久化：重建容器不用重新下载
      - speaches-models:/home/ubuntu/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 浏览器容器属于基础设施：不依赖应用镜像，跟着 `--profile crawler` 起停。
  douyin-browser:
    image: mediacrawler-dy/browser:local
    profiles: ["crawler"]
    build:
      context: ./docker/browser
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: 2gb
    environment: &browser-no-proxy
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    volumes:
      - douyin-browser-profile:/profile
    ports:
      - "127.0.0.1:9223:9222"
      - "127.0.0.1:6081:6080"

  douyin-browser-1:
    image: mediacrawler-dy/browser:local
    profiles: ["crawler"]
    restart: unless-stopped
    shm_size: 2gb
    environment: *browser-no-proxy
    volumes:
      - douyin-browser-profile-1:/profile
    ports:
      - "127.0.0.1:9224:9222"
      - "127.0.0.1:6082:6080"

  douyin-browser-2:
    image: mediacrawler-dy/browser:local
    profiles: ["crawler"]
    restart: unless-stopped
    shm_size: 2gb
    environment: *browser-no-proxy
    volumes:
      - douyin-browser-profile-2:/profile
    ports:
      - "127.0.0.1:9225:9222"
      - "127.0.0.1:6083:6080"

  douyin-browser-3:
    image: mediacrawler-dy/browser:local
    profiles: ["crawler"]
    restart: unless-stopped
    shm_size: 2gb
    environment: *browser-no-proxy
    volumes:
      - douyin-browser-profile-3:/profile
    ports:
      - "127.0.0.1:9226:9222"
      - "127.0.0.1:6084:6080"

volumes:
  app-db-data:
  minio-data:
  speaches-models:
  douyin-browser-profile:
  douyin-browser-profile-1:
  douyin-browser-profile-2:
  douyin-browser-profile-3:
