<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Roboto, sans-serif">
  <rect width="1240" height="820" fill="#FFFFFF"/>

  <defs>
    <marker id="arrowSolid" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- ============ 客户端 ============ -->
  <g>
    <rect x="150" y="30" width="340" height="58" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
    <text x="320" y="55" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">React 前端工作台</text>
    <text x="320" y="75" text-anchor="middle" font-size="11" fill="#64748B">浏览器 · JWT 登录</text>
  </g>
  <g>
    <rect x="640" y="30" width="340" height="58" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
    <text x="810" y="55" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">外部智能体</text>
    <text x="810" y="75" text-anchor="middle" font-size="11" fill="#64748B">MCP 客户端 · Streamable HTTP / stdio</text>
  </g>

  <!-- ============ 入站适配 ============ -->
  <g>
    <rect x="150" y="150" width="340" height="58" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="320" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">crawler-api</text>
    <text x="320" y="195" text-anchor="middle" font-size="11" fill="#64748B">HTTP 入站适配 · JWT 鉴权</text>
  </g>
  <g>
    <rect x="640" y="150" width="340" height="58" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="810" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">crawler-mcp</text>
    <text x="810" y="195" text-anchor="middle" font-size="11" fill="#64748B">MCP 入站网关</text>
  </g>

  <!-- ============ 业务链路 ============ -->
  <g>
    <rect x="150" y="270" width="340" height="58" rx="10" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.5"/>
    <text x="320" y="295" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">crawler-business</text>
    <text x="320" y="315" text-anchor="middle" font-size="11" fill="#64748B">业务域核心 · 后台任务 · 21 张表</text>
  </g>
  <g>
    <rect x="150" y="390" width="340" height="58" rx="10" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="320" y="415" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">crawler-douyin-client</text>
    <text x="320" y="435" text-anchor="middle" font-size="11" fill="#64748B">签名 · 登录 · 互动 · 脱敏</text>
  </g>
  <g>
    <rect x="150" y="510" width="340" height="58" rx="10" fill="#FDF4FF" stroke="#E879F9" stroke-width="1.5"/>
    <text x="320" y="535" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">crawler-browser</text>
    <text x="320" y="555" text-anchor="middle" font-size="11" fill="#64748B">CDP-only 浏览器运行时</text>
  </g>
  <g>
    <rect x="150" y="630" width="340" height="58" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="320" y="655" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">crawler-bootstrap</text>
    <text x="320" y="675" text-anchor="middle" font-size="11" fill="#64748B">配置 · DB 引擎 · 安全原语</text>
  </g>

  <!-- ============ 外部依赖 ============ -->
  <g>
    <rect x="940" y="250" width="280" height="58" rx="10" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="1080" y="275" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">PostgreSQL</text>
    <text x="1080" y="295" text-anchor="middle" font-size="11" fill="#64748B">SQL 数据库</text>
  </g>
  <g>
    <rect x="940" y="334" width="280" height="58" rx="10" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="1080" y="359" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">MinIO 对象存储</text>
    <text x="1080" y="379" text-anchor="middle" font-size="11" fill="#64748B">视频对象存储</text>
  </g>
  <g>
    <rect x="940" y="418" width="280" height="58" rx="10" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="1080" y="443" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">语音转写服务</text>
    <text x="1080" y="463" text-anchor="middle" font-size="11" fill="#64748B">OpenAI 兼容 /v1/audio</text>
  </g>
  <g>
    <rect x="940" y="502" width="280" height="58" rx="10" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="1080" y="527" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">抖音服务</text>
    <text x="1080" y="547" text-anchor="middle" font-size="11" fill="#64748B">搜索 / 详情 / 互动</text>
  </g>
  <g>
    <rect x="940" y="586" width="280" height="58" rx="10" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="1080" y="611" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Chrome / Edge CDP</text>
    <text x="1080" y="631" text-anchor="middle" font-size="11" fill="#64748B">远程调试端口</text>
  </g>

  <!-- ============ 实线：客户端 → 入站 ============ -->
  <line x1="320" y1="88" x2="320" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <line x1="810" y1="88" x2="810" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowSolid)"/>

  <!-- ============ 实线：依赖链 api → business → douyin-client → browser → bootstrap ============ -->
  <line x1="320" y1="208" x2="320" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <line x1="320" y1="328" x2="320" y2="390" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <line x1="320" y1="448" x2="320" y2="510" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <line x1="320" y1="568" x2="320" y2="630" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowSolid)"/>

  <!-- ============ 虚线：MCP 复用 API ============ -->
  <line x1="640" y1="179" x2="494" y2="179" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
  <text x="567" y="171" text-anchor="middle" font-size="10" fill="#64748B">HTTP 复用同一 API</text>

  <!-- ============ 实线：MCP 依赖 bootstrap（代码层） ============ -->
  <polyline points="810,208 810,640 494,659" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#arrowSolid)"/>
  <text x="648" y="668" text-anchor="middle" font-size="10" fill="#64748B">仅代码依赖 bootstrap</text>

  <!-- ============ 虚线：业务 → 外部依赖 ============ -->
  <line x1="490" y1="285" x2="940" y2="279" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
  <text x="705" y="271" text-anchor="middle" font-size="10" fill="#64748B">SQLModel / SQLAlchemy</text>

  <line x1="490" y1="299" x2="940" y2="363" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
  <text x="705" y="345" text-anchor="middle" font-size="10" fill="#64748B">对象读写</text>

  <line x1="490" y1="313" x2="940" y2="447" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
  <text x="705" y="429" text-anchor="middle" font-size="10" fill="#64748B">FFmpeg 音轨 → 远程转写</text>

  <line x1="490" y1="419" x2="940" y2="531" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
  <text x="705" y="513" text-anchor="middle" font-size="10" fill="#64748B">HTTPS 签名请求</text>

  <line x1="490" y1="539" x2="940" y2="615" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
  <text x="705" y="597" text-anchor="middle" font-size="10" fill="#64748B">connect_over_cdp</text>

  <!-- ============ 图例 ============ -->
  <g>
    <line x1="150" y1="762" x2="190" y2="762" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
    <text x="200" y="766" text-anchor="start" font-size="12" fill="#334155">代码依赖方向</text>
    <line x1="320" y1="762" x2="360" y2="762" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
    <text x="370" y="766" text-anchor="start" font-size="12" fill="#334155">运行时调用 / HTTP</text>
    <text x="560" y="766" text-anchor="start" font-size="12" fill="#64748B">依赖方向：api → business → douyin-client → browser → bootstrap；mcp → bootstrap（MCP 运行时经 HTTP 复用 api）</text>
  </g>
</svg>
