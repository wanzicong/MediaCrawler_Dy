<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵感采集台 · 交互原型</title>
<style>
/* ========== 设计 Token（复刻 frontend/src/index.css，默认 violet preset） ========== */
:root {
  --radius: 0.875rem;
  --background: oklch(0.979 0.012 285);
  --foreground: oklch(0.245 0.035 269);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.245 0.035 269);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.245 0.035 269);
  --primary: oklch(0.61 0.225 292);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.958 0.025 289);
  --secondary-foreground: oklch(0.35 0.08 288);
  --muted: oklch(0.957 0.012 278);
  --muted-foreground: oklch(0.52 0.035 270);
  --accent: oklch(0.955 0.03 250);
  --accent-foreground: oklch(0.38 0.13 260);
  --destructive: oklch(0.64 0.205 18);
  --success: oklch(0.72 0.16 164);
  --success-foreground: oklch(0.25 0.08 165);
  --info: oklch(0.67 0.17 251);
  --info-foreground: oklch(0.25 0.1 253);
  --warning: oklch(0.76 0.15 55);
  --warning-foreground: oklch(0.32 0.09 48);
  --border: oklch(0.91 0.025 285);
  --input: oklch(0.91 0.025 285);
  --ring: oklch(0.66 0.19 292);
  --sidebar: oklch(0.989 0.008 286);
  --sidebar-foreground: oklch(0.245 0.035 269);
  --sidebar-primary: oklch(0.61 0.225 292);
  --sidebar-primary-foreground: oklch(0.985 0 0);
  --sidebar-accent: oklch(0.95 0.032 289);
  --sidebar-accent-foreground: oklch(0.43 0.14 289);
  --sidebar-border: oklch(0.91 0.025 285);
}
:root[data-preset="ocean"] {
  --primary: oklch(0.64 0.17 240); --ring: oklch(0.68 0.15 240);
  --sidebar-primary: oklch(0.64 0.17 240);
  --sidebar-accent: oklch(0.95 0.03 235); --sidebar-accent-foreground: oklch(0.4 0.13 240);
}
:root[data-preset="graphite"] {
  --primary: oklch(0.46 0.025 255); --ring: oklch(0.58 0.03 255);
  --sidebar-primary: oklch(0.46 0.025 255);
}
html.dark {
  --background: oklch(0.17 0.025 275);
  --foreground: oklch(0.985 0 0);
  --card: oklch(0.215 0.03 275);
  --card-foreground: oklch(0.985 0 0);
  --popover: oklch(0.215 0.03 275);
  --popover-foreground: oklch(0.985 0 0);
  --primary: oklch(0.72 0.16 292);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.28 0.04 278);
  --secondary-foreground: oklch(0.985 0 0);
  --muted: oklch(0.27 0.025 275);
  --muted-foreground: oklch(0.708 0 0);
  --accent: oklch(0.29 0.06 265);
  --accent-foreground: oklch(0.985 0 0);
  --destructive: oklch(0.704 0.191 22.216);
  --success: oklch(0.74 0.15 164);
  --success-foreground: oklch(0.96 0.03 165);
  --info: oklch(0.72 0.15 251);
  --info-foreground: oklch(0.96 0.02 250);
  --warning: oklch(0.8 0.14 65);
  --warning-foreground: oklch(0.98 0.02 75);
  --border: oklch(1 0 0 / 10%);
  --input: oklch(1 0 0 / 15%);
  --ring: oklch(0.556 0 0);
  --sidebar: oklch(0.195 0.03 277);
  --sidebar-foreground: oklch(0.985 0 0);
  --sidebar-primary: oklch(0.72 0.16 292);
  --sidebar-primary-foreground: oklch(0.985 0 0);
  --sidebar-accent: oklch(0.28 0.055 285);
  --sidebar-accent-foreground: oklch(0.985 0 0);
  --sidebar-border: oklch(1 0 0 / 10%);
}
html.dark[data-preset="ocean"] { --primary: oklch(0.72 0.14 240); --sidebar-primary: oklch(0.72 0.14 240); }
html.dark[data-preset="graphite"] { --primary: oklch(0.75 0.035 255); --sidebar-primary: oklch(0.75 0.035 255); }
:root[data-density="compact"] .card { gap: 0.75rem; padding: 0.75rem; }
:root[data-density="compact"] .metric-card { padding: 0.75rem; }
:root[data-density="compact"] table th { height: 2.25rem; }
:root[data-density="compact"] table td { padding-block: 0.4rem; }

/* ========== 基础 ========== */
* { box-sizing: border-box; border-color: var(--border); }
html, body { margin: 0; padding: 0; min-width: 320px; }
body {
  background: var(--background); color: var(--foreground);
  font-family: Inter, "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px; line-height: 1.6;
  background-image:
    radial-gradient(circle at 88% -8%, color-mix(in oklab, var(--primary) 14%, transparent), transparent 34rem),
    radial-gradient(circle at -8% 26%, color-mix(in oklab, var(--info) 8%, transparent), transparent 32rem),
    radial-gradient(circle at 60% 105%, color-mix(in oklab, var(--success) 6%, transparent), transparent 30rem);
  background-attachment: fixed;
}
button { cursor: pointer; font: inherit; color: inherit; background: none; border: none; }
input, select, textarea { font: inherit; color: var(--foreground); }
a { color: inherit; text-decoration: none; }
::selection { background: color-mix(in oklab, var(--primary) 24%, transparent); }
.muted { color: var(--muted-foreground); }
.small { font-size: 12px; }
.mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
strong { font-weight: 600; }

/* ========== 布局骨架 ========== */
.skip-link { position: fixed; top: 8px; left: 8px; z-index: 100; transform: translateY(-5rem); background: var(--primary); color: var(--primary-foreground); border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.18); transition: transform .2s; }
.skip-link:focus { transform: translateY(0); }
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar {
  width: 244px; flex-shrink: 0; display: flex; flex-direction: column;
  background: color-mix(in oklab, var(--sidebar) 88%, transparent);
  border-right: 1px solid color-mix(in oklab, var(--sidebar-border) 60%, transparent);
  backdrop-filter: blur(18px); transition: width .2s ease;
}
.sidebar.collapsed { width: 64px; }
.sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 20px 16px 12px; }
.sidebar.collapsed .sidebar-logo { justify-content: center; padding: 20px 0 12px; }
.logo-mark { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary), color-mix(in oklab, var(--info) 70%, var(--primary))); color: #fff; box-shadow: 0 8px 20px -8px var(--primary); }
.logo-text { line-height: 1.25; min-width: 0; }
.logo-text b { font-size: 14.5px; letter-spacing: .01em; display: block; }
.logo-text span { font-size: 10.5px; color: var(--muted-foreground); display: block; }
.sidebar.collapsed .logo-text, .sidebar.collapsed .nav-label, .sidebar.collapsed .nav-group-label, .sidebar.collapsed .user-info { display: none; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.nav-group { padding: 8px 0; }
.nav-group-label { display: flex; justify-content: space-between; gap: 8px; padding: 0 12px 4px; font-size: 10px; font-weight: 600; letter-spacing: .16em; color: color-mix(in oklab, var(--sidebar-foreground) 45%, transparent); }
.nav-group-label em { font-style: normal; font-size: 9px; font-weight: 400; letter-spacing: 0; color: color-mix(in oklab, var(--sidebar-foreground) 35%, transparent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item { display: flex; align-items: center; gap: 10px; height: 40px; border-radius: 12px; padding: 0 12px; font-weight: 500; font-size: 13.5px; color: var(--sidebar-foreground); cursor: pointer; transition: all .15s; margin: 1px 0; }
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item:hover { background: color-mix(in oklab, var(--sidebar-accent) 70%, transparent); }
.nav-item.active { background: color-mix(in oklab, var(--sidebar-primary) 12%, transparent); color: var(--sidebar-primary); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.sidebar.collapsed .nav-item { justify-content: center; padding: 0; }
.sidebar-footer { border-top: 1px solid color-mix(in oklab, var(--sidebar-border) 60%, transparent); padding: 8px; }
.user-chip { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 12px; text-align: left; transition: background .15s; position: relative; }
.user-chip:hover { background: color-mix(in oklab, var(--sidebar-accent) 70%, transparent); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #52525b; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.user-info { min-width: 0; flex: 1; }
.user-info b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-info span { display: block; font-size: 11px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.topbar { height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent); background: color-mix(in oklab, var(--background) 90%, transparent); backdrop-filter: blur(18px); padding: 0 16px; z-index: 40; }
.topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.topbar-title p { margin: 0; font-size: 14px; font-weight: 600; }
.topbar-title span { font-size: 11px; color: var(--muted-foreground); }
.topbar-divider { width: 1px; height: 20px; background: var(--border); }
.service-pill { display: flex; align-items: center; gap: 8px; border-radius: 999px; border: 1px solid color-mix(in oklab, var(--success) 35%, transparent); background: color-mix(in oklab, var(--success) 10%, transparent); color: color-mix(in oklab, var(--success) 70%, black); padding: 6px 12px; font-size: 12px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
html.dark .service-pill { color: var(--success-foreground); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); position: relative; }
.status-dot::after { content: ""; position: absolute; inset: -3px; border-radius: inherit; border: 1px solid currentColor; opacity: 0; animation: pulse 2s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.8); opacity: .28; } 70%, 100% { transform: scale(1.6); opacity: 0; } }
.content { flex: 1; overflow-y: auto; padding: 16px 20px; }
.content-inner { max-width: 1600px; margin: 0 auto; }
.page-stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* ========== 通用组件 ========== */
.page-hero { position: relative; overflow: hidden; border: 1px solid color-mix(in oklab, var(--primary) 13%, var(--border)); border-radius: 16px; background: linear-gradient(135deg, color-mix(in oklab, var(--card) 96%, var(--primary)), color-mix(in oklab, var(--card) 97%, var(--info))); padding: 18px; box-shadow: 0 24px 55px -42px oklch(0.45 0.2 285 / 0.58); }
.page-hero::before { content: ""; position: absolute; width: 19rem; height: 19rem; right: -8rem; top: -11rem; border-radius: 999px; background: color-mix(in oklab, var(--primary) 18%, transparent); pointer-events: none; }
.page-hero::after { content: ""; position: absolute; width: 13rem; height: 13rem; left: 35%; bottom: -10rem; border-radius: 999px; background: color-mix(in oklab, var(--info) 13%, transparent); pointer-events: none; }
.hero-row { position: relative; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; z-index: 1; }
.hero-main { min-width: 0; max-width: 48rem; }
.eyebrow { display: inline-flex; align-items: center; gap: 6px; color: var(--primary); font-size: 12px; font-weight: 700; letter-spacing: .04em; margin: 0; }
.eyebrow svg { width: 15px; height: 15px; }
.page-hero h1 { margin: 4px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.03em; }
.page-hero .desc { margin: 4px 0 0; max-width: 48rem; font-size: 13px; line-height: 1.6; color: var(--muted-foreground); }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex-shrink: 0; }
.hero-extra { position: relative; margin-top: 14px; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; }

.metric-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.metric-card { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: 16px; background: var(--card); padding: 16px; box-shadow: 0 12px 32px -24px oklch(0.45 0.16 285 / 0.45); transition: all .2s; }
.metric-card:hover { transform: translateY(-2px); border-color: color-mix(in oklab, var(--primary) 25%, var(--border)); }
.metric-card::before { content: ""; position: absolute; inset-inline: 0; top: 0; height: 5rem; background: linear-gradient(135deg, var(--tone-glow), transparent); opacity: .8; pointer-events: none; }
.metric-card .mc-row { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.metric-card .mc-label { font-size: 12px; font-weight: 500; letter-spacing: .02em; color: var(--muted-foreground); margin: 0; }
.metric-card .mc-value { margin-top: 4px; font-size: 24px; font-weight: 600; letter-spacing: -0.035em; }
.metric-card .mc-detail { margin-top: 4px; font-size: 12px; color: var(--muted-foreground); margin-bottom: 0; }
.metric-card .mc-icon { width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--tone-icon); ring: 1px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.5); transition: transform .2s; }
.metric-card:hover .mc-icon { transform: scale(1.05); }
.metric-card .mc-icon svg { width: 20px; height: 20px; }
.tone-violet { --tone-icon: color-mix(in oklab, #7c3aed 12%, transparent); --tone-text: #6d28d9; --tone-glow: color-mix(in oklab, #7c3aed 16%, transparent); }
.tone-blue { --tone-icon: color-mix(in oklab, #2563eb 12%, transparent); --tone-text: #1d4ed8; --tone-glow: color-mix(in oklab, #2563eb 16%, transparent); }
.tone-mint { --tone-icon: color-mix(in oklab, #059669 12%, transparent); --tone-text: #047857; --tone-glow: color-mix(in oklab, #059669 16%, transparent); }
.tone-coral { --tone-icon: color-mix(in oklab, #ea580c 12%, transparent); --tone-text: #c2410c; --tone-glow: color-mix(in oklab, #ea580c 16%, transparent); }
.tone-rose { --tone-icon: color-mix(in oklab, #e11d48 12%, transparent); --tone-text: #be123c; --tone-glow: color-mix(in oklab, #e11d48 16%, transparent); }
.tone-slate { --tone-icon: color-mix(in oklab, #475569 10%, transparent); --tone-text: #334155; --tone-glow: color-mix(in oklab, #475569 12%, transparent); }
.metric-card .mc-icon { color: var(--tone-text); }
html.dark .tone-violet { --tone-text: #c4b5fd; } html.dark .tone-blue { --tone-text: #93c5fd; }
html.dark .tone-mint { --tone-text: #6ee7b7; } html.dark .tone-coral { --tone-text: #fdba74; }
html.dark .tone-rose { --tone-text: #fda4af; } html.dark .tone-slate { --tone-text: #cbd5e1; }

.card { border: 1px solid var(--border); border-radius: 16px; background: var(--card); padding: 16px; box-shadow: 0 12px 32px -28px oklch(0.45 0.16 285 / 0.45); }
.card-title { margin: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; }
.card-desc { margin: 2px 0 0; font-size: 12.5px; color: var(--muted-foreground); }
.section-heading { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.section-heading h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.section-heading p { margin: 4px 0 0; font-size: 13px; color: var(--muted-foreground); }
.filter-panel { min-width: 0; border: 1px solid var(--border); border-radius: 16px; background: color-mix(in oklab, var(--card) 94%, transparent); padding: 12px; box-shadow: 0 14px 36px -34px oklch(0.42 0.15 285 / 0.46); backdrop-filter: blur(18px); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; font-size: 13px; font-weight: 500; border: 1px solid transparent; transition: all .15s; white-space: nowrap; }
.btn svg { width: 15px; height: 15px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-brand { background: var(--primary); color: var(--primary-foreground); box-shadow: 0 8px 20px -10px var(--primary); }
.btn-brand:hover:not(:disabled) { filter: brightness(1.06); }
.btn-outline { border-color: var(--border); background: color-mix(in oklab, var(--card) 80%, transparent); }
.btn-outline:hover:not(:disabled) { background: var(--accent); }
.btn-ghost { color: var(--muted-foreground); }
.btn-ghost:hover:not(:disabled) { background: var(--accent); color: var(--accent-foreground); }
.btn-destructive { background: var(--destructive); color: #fff; }
.btn-destructive:hover:not(:disabled) { filter: brightness(1.08); }
.btn-outline-destructive { border-color: color-mix(in oklab, var(--destructive) 40%, transparent); color: var(--destructive); background: transparent; }
.btn-outline-destructive:hover:not(:disabled) { background: color-mix(in oklab, var(--destructive) 8%, transparent); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn-icon { width: 32px; height: 32px; padding: 0; border-radius: 8px; }
.btn-icon-sm { width: 26px; height: 26px; padding: 0; border-radius: 6px; }
.btn-icon svg, .btn-icon-sm svg { width: 15px; height: 15px; }

.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
.badge svg { width: 11px; height: 11px; }
.badge-default { background: var(--primary); color: var(--primary-foreground); }
.badge-secondary { background: var(--secondary); color: var(--secondary-foreground); }
.badge-outline { border-color: var(--border); color: var(--muted-foreground); }
.badge-destructive { background: color-mix(in oklab, var(--destructive) 12%, transparent); color: var(--destructive); border-color: color-mix(in oklab, var(--destructive) 25%, transparent); }
.badge-success { background: color-mix(in oklab, var(--success) 14%, transparent); color: color-mix(in oklab, var(--success) 72%, black); border-color: color-mix(in oklab, var(--success) 30%, transparent); }
.badge-info { background: color-mix(in oklab, var(--info) 12%, transparent); color: color-mix(in oklab, var(--info) 78%, black); border-color: color-mix(in oklab, var(--info) 28%, transparent); }
.badge-warning { background: color-mix(in oklab, var(--warning) 14%, transparent); color: color-mix(in oklab, var(--warning) 74%, black); border-color: color-mix(in oklab, var(--warning) 32%, transparent); }
html.dark .badge-success, html.dark .badge-info, html.dark .badge-warning { color: var(--foreground); }

.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid; padding: 5px 12px; font-size: 12px; font-weight: 500; }
.pill-blue { border-color: #bfdbfe; background: #eff6ff; color: #1d4ed8; }
.pill-green { border-color: #a7f3d0; background: #ecfdf5; color: #047857; }
.pill-amber { border-color: #fde68a; background: #fffbeb; color: #b45309; }
.pill-violet { border-color: #ddd6fe; background: #f5f3ff; color: #6d28d9; }
html.dark .pill-blue { border-color: #1e3a8a; background: rgba(30,58,138,.4); color: #93c5fd; }
html.dark .pill-green { border-color: #064e3b; background: rgba(6,78,59,.4); color: #6ee7b7; }
html.dark .pill-amber { border-color: #78350f; background: rgba(120,53,15,.4); color: #fcd34d; }
html.dark .pill-violet { border-color: #4c1d95; background: rgba(76,29,149,.4); color: #c4b5fd; }

.input, .select { height: 36px; border: 1px solid var(--input); border-radius: 10px; background: color-mix(in oklab, var(--card) 80%, transparent); padding: 0 12px; font-size: 13px; outline: none; min-width: 0; }
.input:focus, .select:focus, textarea:focus { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 20%, transparent); }
.input::placeholder, textarea::placeholder { color: color-mix(in oklab, var(--muted-foreground) 70%, transparent); }
textarea { border: 1px solid var(--input); border-radius: 10px; background: color-mix(in oklab, var(--card) 80%, transparent); padding: 8px 12px; font-size: 13px; outline: none; resize: vertical; width: 100%; }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%), linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; cursor: pointer; }
.search-wrap { position: relative; flex: 1; min-width: 200px; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted-foreground); pointer-events: none; }
.search-wrap .input { width: 100%; padding-left: 32px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > label { font-size: 13px; font-weight: 500; }
.field .hint { font-size: 11.5px; color: var(--muted-foreground); }
.field .error-text { font-size: 11.5px; color: var(--destructive); }
.checkbox { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; user-select: none; }

function badge(text, kind) { return `<span class="badge badge-${kind || "secondary"}">${text}</span>`; }
function taskStatusBadge(st) {
  const map = { queued: ["排队中", "secondary"], waiting_login: ["等待扫码", "warning"], running: ["运行中", "info"], processing_media: ["处理视频/字幕", "info"], cancelling: ["取消中", "warning"], succeeded: ["已完成", "success"], failed: ["失败", "destructive"], cancelled: ["已取消", "outline"], interrupted: ["已中断", "warning"] };
  const [t, k] = map[st] || [st, "secondary"];
  return badge(t, k);
}
function interactionStatusBadge(st) {
  const map = { pending_confirmation: ["待确认", "outline"], queued: ["排队中", "outline"], running: ["发送中", "info"], succeeded: ["已成功", "default"], failed: ["失败", "destructive"], blocked: ["已暂停", "destructive"], needs_review: ["待人工核对", "warning"], cancelled: ["已取消", "outline"] };
  const [t, k] = map[st] || [st, "outline"];
  return badge(t, k);
}
function interactionTypeLabel(t) { return { video_comment: "视频评论", comment_reply: "评论回复", creator_message: "作者私信" }[t] || t; }
function accountStatusBadge(st) {
  const map = { login_required: ["待登录", "secondary"], verifying: ["待验证", "secondary"], ready: ["可用", "default"], busy: ["执行中", "info"], cooldown: ["冷却中", "secondary"], unhealthy: ["异常", "destructive"], disabled: ["已停用", "destructive"] };
  const [t, k] = map[st] || [st, "secondary"];
  return badge(t, k);
}
function keywordStatusBadge(st) {
  const map = { unprocessed: ["未爬取", "secondary"], active: ["进行中", "info"], crawled: ["已爬取", "success"], failed: ["需要重试", "destructive"] };
  const [t, k] = map[st] || [st, "secondary"];
  return badge(t, k);
}
function subtitleBadge(st) {
  const map = { pending: ["字幕排队", "outline"], running: ["字幕处理中", "info"], completed: ["字幕完成", "success"], failed: ["字幕失败", "destructive"] };
  if (!st) return badge("无字幕", "outline");

}
function pipelineLabel(st) {

}
function metricCard(ic, label, value, detail, tone) {
  return `<div class="metric-card tone-${tone || "violet"}"><div class="mc-row"><div class="grow"><p class="mc-label">${label}</p><div class="mc-value">${value}</div>${detail ? `<p class="mc-detail">${detail}</p>` : ""}</div><span class="mc-icon">${icon(ic, 20)}</span></div></div>`;
}
function pageHero(eyebrow, ic, title, desc, actions, extra) {
  return `<section class="page-hero"><div class="hero-row"><div class="hero-main"><p class="eyebrow">${ic ? icon(ic, 15) : ""}${eyebrow}</p><h1>${title}</h1><p class="desc">${desc}</p></div>${actions ? `<div class="hero-actions">${actions}</div>` : ""}</div>${extra ? `<div class="hero-extra">${extra}</div>` : ""}</section>`;
}
function coverHtml(work, big) {

}
function emptyState(ic, title, desc) {

function errorState(title, desc, retry) {

function stepCard(name, detail, pct, taskStatus) {
  const state = pct >= 100 ? "done" : pct > 0 ? "on" : "";
  return `<div class="step-card ${state}"><div class="sc-head"><span class="sc-name">${name}</span><span class="sc-pct">${pct >= 100 ? "已完成" : pct > 0 ? pct + "%" : "--"}</span></div><div class="sc-detail">${detail}</div><div class="progress ${pct >= 100 ? "green" : ""} mt8"><i style="width:${pct}%"></i></div></div>`;
}
function toggleAllWorks(cb) { $$(".works-sel").forEach(c => { c.checked = cb.checked; }); updateWorksSel(); }
function updateWorksSel() { const n = $$(".works-sel:checked").length; const el = $("#works-sel-count"); if (el) el.textContent = n; }
function exportSelected(kind) {

/* ==================== 页面渲染：沉浸播放 ==================== */
function renderFeed(taskId) {
  state.feedIdx = 0;
  return `<div class="feed-mode">
    <div class="feed-top">
      <button class="btn btn-outline btn-icon" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff" title="退出沉浸播放" onclick="go('${taskId === "library" ? "/douyin-library" : "/douyin/" + taskId}')">${icon("x", 16)}</button>
      <span class="feed-count" id="feed-count">1 / ${DB.works.length}</span>
    </div>
    <div class="feed-slide" id="feed-slide">${feedSlideHtml(0)}</div>
    <div class="feed-nav">
      <button title="上一个视频" onclick="feedMove(-1)" id="feed-prev" disabled>${icon("chevronUp", 18)}</button>
      <button title="下一个视频" onclick="feedMove(1)" id="feed-next">${icon("chevronDown", 18)}</button>
    </div>
    <div class="feed-tip">滚轮、↑↓、J/K 或上下滑动切换视频</div>
  </div>`;
}
function feedSlideHtml(i) {
  const w = DB.works[i];
  return `<div class="feed-video">${coverHtml(w, true)}
    <button class="feed-play" onclick="toast('操作成功','正在播放（原型演示）')">${icon("play", 26)}</button>
    <div class="feed-meta"><div class="author">@${esc(w.author)}</div><div class="title">${esc(w.title)}</div><div class="sub">发布于 ${w.published} · ${w.storage === "minio" ? "云端存储" : "本地服务器"}</div></div>
    <div class="feed-side">
      <div class="fs-item">${icon("heart", 26)}<span>${w.liked}</span></div>
      <div class="fs-item">${icon("comment", 24)}<span>${w.persisted}</span></div>
      <div class="fs-item">${icon("share", 24)}<span>${w.shared}</span></div>
    </div>
  </div>`;
}
function feedMove(d) {
  const n = DB.works.length;
  state.feedIdx = Math.min(n - 1, Math.max(0, state.feedIdx + d));
  $("#feed-slide").innerHTML = feedSlideHtml(state.feedIdx);
  $("#feed-count").textContent = `${state.feedIdx + 1} / ${n}`;
  $("#feed-prev").disabled = state.feedIdx === 0;
  $("#feed-next").disabled = state.feedIdx === n - 1;
}
document.addEventListener("keydown", (e) => {
  if (!document.querySelector(".feed-mode")) return;
  if (["ArrowDown", "PageDown", "j"].includes(e.key)) feedMove(1);
  if (["ArrowUp", "PageUp", "k"].includes(e.key)) feedMove(-1);
  if (e.key === "Escape") history.back();
});
</script>

function interactionRowHtml(it, compact) {

  return `<tr>

    <td style="max-width:240px"><p class="small" style="margin:0">${esc(it.content)}</p>${it.replyTo ? `<div class="reply-quote mt8">回复 @：${esc(it.replyTo)}</div>` : `<div class="small muted">目标：${esc(it.target)}</div>`}</td>

      <button class="btn btn-ghost btn-icon-sm" title="查看实时监控" onclick="openLiveMonitor('${it.id}')">${icon("monitor", 14)}</button>

      ${canRetry ? `<button class="btn btn-ghost btn-icon-sm" title="重试" onclick="retryInteraction('${it.id}')">${icon("rotate", 14)}</button>` : ""}
      ${canCancel ? `<button class="btn btn-ghost btn-icon-sm" title="取消" onclick="confirmBox('确认取消这条互动任务？','取消后不会进入发送队列。',()=>toast('操作成功','互动任务已取消'))">${icon("x", 14)}</button>` : ""}
    </div></td>
  </tr>`;
}
function renderInteractions() {
  return `<div class="page-stack">
    ${pageHero("互动运营与风控", "comments", "互动任务", "统一管理视频评论、评论回复和作者私信的确认、进度与重试；发送配额和异常状态保持可见。",
      `<button class="btn btn-outline" onclick="toast('操作成功','互动任务已刷新')">${icon("refresh", 15)}刷新</button>
       <button class="btn btn-brand" onclick="confirmBox('将重新调度全部尚未成功且当前不在发送中的互动任务；发送中的任务不会重复提交。是否继续？','',()=>toast('操作成功','已将 3 条可重试互动任务重新排队'))">${icon("rotate", 15)}重试全部可重试项</button>`)}
    <div class="grid-4">
      ${DB.accounts.map(a => `<div class="quota-card">
        <div class="row-between"><b class="small ellipsis">${esc(a.name)}</b>${badge(a.status === "ready" ? "可用" : a.status === "busy" ? "可用" : "暂停", a.status === "cooldown" ? "warning" : "success")}</div>

function confirmInteraction(id) {
  const it = DB.interactions.find(x => x.id === id);
  it.status = "queued"; rerender();
  toast("操作成功", "互动任务已确认并进入发送队列");
}
function retryInteraction(id) {
  const it = DB.interactions.find(x => x.id === id);
  if (it.status === "needs_review") {
    confirmBox("请先到抖音页面确认这条内容没有发送成功。确认未发送并重试吗？", "", () => { it.status = "queued"; rerender(); toast("操作成功", "互动任务已重新排队"); });
    return;
  }
  it.status = "queued"; rerender();
  toast("操作成功", "互动任务已重新排队");
}
function openInteractionDetail(id) {
  const it = DB.interactions.find(x => x.id === id);
  openDialog(`<div class="dialog-head"><div><h2>互动任务详情</h2><p class="dialog-desc">完整内容仅对任务所有者可见，不会写入应用日志。</p></div><button class="btn btn-ghost btn-icon" onclick="closeDialog()">${icon("x", 15)}</button></div>

      <div class="timeline mt12">
        ${[["已创建互动任务", "done", "10:51:58"], ["用户已确认发送", "done", "10:52:03"], ["开始执行互动任务", "done", "10:52:11 · 第 1 次执行"], ["连接账号浏览器", "done", "10:52:13"], ["验证账号登录状态", "done", "10:52:15"], ["打开目标视频", "done", "10:52:19"], ["打开评论输入框", "done", "10:52:24"], ["填写互动内容", "done", "10:52:29"], ["触发发送", "done", "10:52:31"], [it.status === "succeeded" ? "平台确认接收" : "保留异常页面现场", it.status === "succeeded" ? "done" : "fail", "10:52:36"]].map(([label, cls, time]) => `<div class="timeline-item ${cls}"><p class="small" style="margin:0;font-weight:500">${label}</p><span class="small muted">${time}</span></div>`).join("")}
      </div>

    </div>`, "wide");
}

/* 互动撰写三段式 */
function openComposer(type, targetName) {
  const labels = { video_comment: ["评论视频", "评论", "评论将通过所选托管账号的专属浏览器发送。"], comment_reply: ["回复评论", "回复", "系统会在作品评论区定位这条评论，再通过专属浏览器发送回复。"], creator_message: ["私信作者", "私信", "作者标识只在执行时从作品详情临时解析，不会留存在内容数据或操作记录中。"] };
  const [title, action, desc] = labels[type];
  state.composerType = type;
  openDialog(`<div class="dialog-head"><div><h2>${title}</h2><p class="dialog-desc">${desc}</p></div><button class="btn btn-ghost btn-icon" onclick="closeDialog()">${icon("x", 15)}</button></div>
    <div class="card mb12" style="box-shadow:none;padding:10px 12px"><span class="small">${type === "comment_reply" ? `回复 @匿名用户：` : ""}<b>${esc(targetName)}</b></span></div>
    <div class="field"><label>发送账号</label><select class="select" style="width:100%"><option value="">选择一个已登录账号</option>${DB.accounts.filter(a => ["ready", "busy"].includes(a.status)).map(a => `<option>${esc(a.name)} · 可用</option>`).join("")}</select><span class="hint" id="composer-quota">今日剩余 38/50 · 最小间隔 45 秒</span></div>
    <div class="field"><label>发送内容</label><textarea rows="3" id="composer-content" maxlength="${type === "creator_message" ? 1000 : 2200}" placeholder="输入要${action}的内容" oninput="document.getElementById('composer-count').textContent=this.value.length+'/${type === "creator_message" ? 1000 : 2200}'"></textarea><span class="hint" id="composer-count">0/${type === "creator_message" ? 1000 : 2200}</span><span class="hint">内容会加密保存，不会写入应用日志。重复目标和内容在 24 小时内会被拦截。</span></div>
    <div id="composer-prepared" style="display:none"><div class="alert alert-blue"><span style="color:var(--info)">${icon("alert", 18)}</span><div><p class="alert-title">等待最终确认</p><p class="alert-desc">草稿已经保存，但尚未发送。点击“确认并发送”后才会进入浏览器执行队列。</p></div></div></div>
    <div class="dialog-foot" id="composer-foot">
      <button class="btn btn-outline" onclick="closeDialog()">取消</button>
      <button class="btn btn-brand" id="composer-main-btn" onclick="composerNext()">发送前检查</button>
    </div>`);
}
function composerNext() {
  const content = $("#composer-content").value.trim();
  if (!content) { toast("操作失败", "请输入发送内容"); return; }
  const prepared = $("#composer-prepared");
  if (prepared.style.display === "none") {
    prepared.style.display = "";
    $("#composer-foot").innerHTML = `<button class="btn btn-outline" onclick="closeDialog()">稍后处理</button><button class="btn btn-outline" onclick="composerConfirm(true)">发送并查看实时监控</button><button class="btn btn-brand" onclick="composerConfirm(false)">确认并发送</button>`;
    toast("操作成功", "发送前检查通过，草稿已保存，请再次确认发送");
  }
}
function composerConfirm(monitor) {
  closeDialog();
  toast("操作成功", "互动任务已确认并进入浏览器执行队列");
  if (monitor) setTimeout(() => { go("/douyin-interactions"); setTimeout(() => openLiveMonitor(DB.interactions[0].id), 400); }, 300);
}

function setDark(v) { state.theme.dark = v; applyTheme(); rerender(); }

/* ==================== 全局状态与主题 ==================== */
const THEME_KEY = "lcj-proto-theme";
const state = {
  loggedIn: false,
  feedIdx: 0,
  collapsed: false,
  browserSlot: null,
  composerType: null,
  settingsTab: "profile",
  theme: { dark: false, preset: "violet", density: "comfortable" },
};
try {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) Object.assign(state.theme, JSON.parse(saved));
  state.loggedIn = localStorage.getItem("lcj-proto-auth") === "1";
} catch (e) { /* 隐私模式下忽略存储异常 */ }
function applyTheme() {
  const t = state.theme;
  document.documentElement.classList.toggle("dark", !!t.dark);
  if (t.preset && t.preset !== "violet") document.documentElement.dataset.preset = t.preset;
  else delete document.documentElement.dataset.preset;
  if (t.density === "compact") document.documentElement.dataset.density = "compact";
  else delete document.documentElement.dataset.density;
  try { localStorage.setItem(THEME_KEY, JSON.stringify(t)); } catch (e) {}
}
function cycleTheme() { setDark(!state.theme.dark); }
function doLogout() {
  state.loggedIn = false;
  try { localStorage.removeItem("lcj-proto-auth"); } catch (e) {}
  location.hash = "#/login";
  toast("操作成功", "已退出登录");
}

/* ==================== 基础交互设施：toast / dialog / confirm / dropdown ==================== */
function toast(title, desc) {
  let root = $("#toast-root");
  if (!root) { root = document.createElement("div"); root.id = "toast-root"; document.body.appendChild(root); }
  const ok = !/失败|错误|Error/i.test(title);
  const el = document.createElement("div");
  el.className = "toast " + (ok ? "ok" : "err");
  el.innerHTML = `<span class="t-icon">${icon(ok ? "check" : "alert", 16)}</span><div class="grow"><p class="t-title">${esc(title)}</p>${desc ? `<p class="t-desc">${esc(desc)}</p>` : ""}</div>`;
  root.appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s, transform .3s"; el.style.opacity = "0"; el.style.transform = "translateX(20px)"; setTimeout(() => el.remove(), 320); }, 3400);
}
function openDialog(html, size) {
  closeDialog();
  const ov = document.createElement("div");
  ov.className = "overlay"; ov.id = "dialog-overlay";
  ov.innerHTML = `<div class="dialog ${size || ""}" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener("mousedown", (e) => { if (e.target === ov) closeDialog(); });
  document.body.appendChild(ov);
}
function closeDialog() { const d = $("#dialog-overlay"); if (d) d.remove(); }
function confirmBox(title, desc, fn) {
  openDialog(`<div class="dialog-head"><div><h2>${title}</h2>${desc ? `<p class="dialog-desc">${desc}</p>` : ""}</div></div>
    <div class="dialog-foot"><button class="btn btn-outline" onclick="closeDialog()">取消</button><button class="btn btn-destructive" id="confirm-ok-btn">确认</button></div>`);
  $("#confirm-ok-btn").onclick = () => { closeDialog(); fn(); };
}
function closeDropdown() { const d = $("#dropdown-root"); if (d) d.remove(); }
function openDropdown(anchor, items) {
  closeDropdown();
  const r = anchor.getBoundingClientRect();
  const dd = document.createElement("div");
  dd.className = "dropdown"; dd.id = "dropdown-root";
  dd.innerHTML = items.map((it, i) => {
    if (it.sep) return `<div class="dropdown-sep"></div>`;
    if (it.head) return `<div class="dropdown-label">${esc(it.head)}</div>`;
    return `<button class="dropdown-item ${it.danger ? "danger" : ""} ${it.disabled ? "disabled" : ""}" data-i="${i}">${it.icon ? icon(it.icon, 14) : ""}<span class="grow">${esc(it.label)}</span>${it.check ? icon("check", 13) : ""}</button>`;
  }).join("");
  document.body.appendChild(dd);
  const dh = dd.offsetHeight;
  const openUp = r.bottom + dh + 12 > window.innerHeight;
  dd.style.left = Math.min(r.left, window.innerWidth - dd.offsetWidth - 12) + "px";
  dd.style.top = (openUp ? Math.max(8, r.top - dh - 6) : r.bottom + 6) + "px";
  items.forEach((it, i) => {
    const b = dd.querySelector(`[data-i="${i}"]`);
    if (b && it.fn && !it.disabled) b.onclick = () => { closeDropdown(); it.fn(); };
  });
  setTimeout(() => document.addEventListener("mousedown", (e) => { if (!dd.contains(e.target)) closeDropdown(); }, { once: true }), 0);
}

const SECTIONS = [

  ["/douyin-interactions", "互动任务"], ["/douyin-keywords", "关键词管理"], ["/douyin-library", "视频资源库"],
  ["/douyin-tags", "标签管理"], ["/douyin-tracks", "赛道管理"], ["/douyin", "爬取任务"],
  ["/developer-tools", "开发者中心"], ["/admin", "用户管理"], ["/settings", "个人设置"],
];
function sectionName(path) {
  for (const [p, n] of SECTIONS) if (path === p || path.startsWith(p + "/")) return n;
  return "运营工作台";
}
function navActive(itemPath, path) {
  if (itemPath === "/") return path === "/";
  if (itemPath === "/douyin") return path === "/douyin" || path.startsWith("/douyin/");
  return path === itemPath || path.startsWith(itemPath + "/");
}
function go(path) { location.hash = "#" + path; }
function openUserMenu(ev) {
  const t = state.theme;
  openDropdown(ev.currentTarget, [
    { head: DB.user.email },
    { icon: "settings", label: "个人设置", fn: () => go("/settings") },
    { sep: true },
    { icon: t.dark ? "sun" : "moon", label: t.dark ? "切换为浅色外观" : "切换为深色外观", fn: () => setDark(!t.dark) },
    { head: "主题色" },
    { icon: "palette", label: "跃动紫", check: t.preset === "violet", fn: () => setPreset("violet") },
    { icon: "palette", label: "清透蓝", check: t.preset === "ocean", fn: () => setPreset("ocean") },
    { icon: "palette", label: "专业灰", check: t.preset === "graphite", fn: () => setPreset("graphite") },
    { head: "布局密度" },
    { icon: "layers", label: "舒适", check: t.density === "comfortable", fn: () => setDensity("comfortable") },

function protoNote() {
  return `<div class="proto-note" id="proto-note"><b>交互原型</b><span>单文件演示 · 数据均为模拟 · 操作不产生真实请求</span><button class="btn btn-ghost btn-icon-sm" title="关闭提示" onclick="this.parentElement.remove()">${icon("x", 12)}</button></div>`;

function renderApp(content, path) {
  return `<a class="skip-link" href="#main-content">跳到主要内容</a>

/* ==================== 路由器 ==================== */
function currentPath() {
  const h = (location.hash || "").replace(/^#/, "");
  return h.startsWith("/") ? h : "/";
}
function resolvePage(path) {
  const parts = path.split("/").filter(Boolean);
  if (parts.length === 0) return renderDashboard();
  const [p0, p1] = parts;
  switch (p0) {
    case "douyin-tracks": return p1 ? renderTrackDetail(p1) : renderTracks();
    case "douyin": return p1 ? renderTaskDetail(p1) : renderTasks();
    case "douyin-keywords": return renderKeywords();
    case "douyin-library": return renderLibrary();
    case "douyin-comments": return renderComments();
    case "douyin-tags": return renderTags();
    case "douyin-interactions": return renderInteractions();
    case "douyin-accounts": return renderAccounts();
    case "douyin-browsers": return renderBrowsers();
    case "developer-tools": return renderDeveloper();
    case "admin": return renderAdmin();
    case "settings": return renderSettings();
    default: return `<div class="page-stack">${errorState("页面不存在", "路径 " + esc(path) + " 没有对应的页面。", true)}</div>`;
  }
}
function render() {
  const path = currentPath();
  const app = $("#app");
  closeDialog(); closeDrawer(); closeDropdown();
  if (path === "/login") {
    if (state.loggedIn) { location.hash = "#/"; return; }
    document.title = "登录 · 灵感采集台";
    app.innerHTML = renderLogin();
    return;
  }
  if (!state.loggedIn) { location.hash = "#/login"; return; }
  if (path.endsWith("/feed")) {
    document.title = "沉浸播放 · 灵感采集台";
    const taskId = path === "/douyin-library/feed" ? "library" : path.split("/")[2];
    app.innerHTML = renderFeed(taskId) + protoNote();
    return;
  }
  document.title = sectionName(path) + " · 灵感采集台";
  app.innerHTML = renderApp(resolvePage(path), path);
  $("#main-content").scrollTop = 0;
}
function rerender() {
  const el = $("#main-content");
  const st = el ? el.scrollTop : 0;
  render();
  const el2 = $("#main-content");
  if (el2) el2.scrollTop = st;
}
window.addEventListener("hashchange", render);
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (document.querySelector(".feed-mode")) return; /* 沉浸播放的 Esc 由 part4 处理 */
  if ($("#dialog-overlay")) closeDialog();
  else if ($("#drawer-root")) closeDrawer();
  else closeDropdown();
});

/* ==================== 模拟轮询：运行中任务进度缓慢推进 ==================== */
setInterval(() => {
  let changed = false;
  DB.tasks.forEach(t => {
    if (t.status === "running" && t.progress < 97) { t.progress += 1; t.works += (t.progress % 7 === 0 ? 1 : 0); changed = true; }
  });
  if (!changed) return;
  /* 用户正在对话框/抽屉中操作或在输入框中键入时，本轮不刷新，避免打断交互 */
  if (document.querySelector("#dialog-overlay") || document.querySelector("#drawer-root")) return;
  const ae = document.activeElement;
  if (ae && ["INPUT", "TEXTAREA", "SELECT"].includes(ae.tagName)) return;
  const path = currentPath();
  if (path === "/" || path === "/douyin" || /^\/douyin\/[^/]+$/.test(path)) rerender();
}, 5000);

/* ==================== 启动 ==================== */
applyTheme();
if (!location.hash) location.hash = state.loggedIn ? "#/" : "#/login";
render();
