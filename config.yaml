# 结构化业务配置（Spring Boot 风格的「一份文件看全」）。
#
# 优先级：显式入参 > 环境变量 > .env.local > .env > 本文件 > 代码默认值。
# 也就是说：**想让这里的值生效，请把同名项从 .env / .env.local 里删掉**；
# 环境变量永远压过本文件（容器编排、CI 临时覆盖都靠这一点，例如 compose.yml
# 会把 MEDIA_OUTPUT_DIR 覆盖成容器内路径）。
#
# 两种写法：
#   1. 直接写字面值（推荐用于业务默认值）；
#   2. `${ENV_VAR:默认值}` 占位符引用环境变量——连接串、密钥这类按环境变化的值
#      就用它，既保证配置全貌都在本文件，又不把密钥写进仓库。
#      `${VAR}`（无默认值）在变量缺失时视为「未设置」，回落到代码默认值。
#
# profile 覆盖：另建 ``config.<profile>.yaml``（profile 取 CRAWLER_CONFIG_PROFILE
# 或 ENVIRONMENT，默认 local），同名叶子键会**深层覆盖**本文件，等价于 Spring 的
# ``application-<profile>.yml``。
#
# 只有两类内容不写进本文件：
#   1. 真正的密钥——SECRET_KEY、POSTGRES_PASSWORD、MINIO_ACCESS_KEY/SECRET_KEY、
#      WHISPER_API_KEY、MCP_API_PASSWORD、SMTP_PASSWORD、FIRST_SUPERUSER_PASSWORD；
#   2. 进程级开关 TESTING（测试进程标记）。
# 其它所有配置项都在本文件里有对应条目（有架构测试保证不漏项）。
# 括号里标注的是对应的旧环境变量名，方便从 .env 迁移与排查。
# 本文件在进程启动时读取一次，改完需要重启后端。

# ── 应用与认证────────────────────────────────────────────────────────────
app:
  project_name: "${PROJECT_NAME:Douyin Crawler Full Stack}"   # 项目名，用于接口标题与邮件
  environment: "${ENVIRONMENT:local}"        # local / staging / production；同时决定 profile 文件
  api_v1_str: "${API_V1_STR:/api/v1}"        # API 路由前缀（改动会影响所有接口路径）
  frontend_host: "${FRONTEND_HOST:http://localhost:5173}"     # 前端地址，参与 CORS 与邮件链接
  cors_origins: "${BACKEND_CORS_ORIGINS:}"   # 额外允许的 CORS 来源，逗号分隔或 JSON 数组
  access_token_expire_minutes: "${ACCESS_TOKEN_EXPIRE_MINUTES:11520}"   # 登录令牌有效期（分钟）
  sentry_dsn: "${SENTRY_DSN:}"               # 可选：配置后启用错误上报
  first_superuser: "${FIRST_SUPERUSER:}"     # 初始超级管理员邮箱（密码留环境变量）

# ── 数据库与对象存储（口令留环境变量）────────────────────────────────────
database:
  server: "${POSTGRES_SERVER:localhost}"     # 数据库主机
  port: "${POSTGRES_PORT:5432}"              # 数据库端口
  user: "${POSTGRES_USER:postgres}"          # 数据库用户（密码走 POSTGRES_PASSWORD）
  name: "${POSTGRES_DB:app}"                 # 数据库名（测试库见 .env 的 TEST_POSTGRES_DB）
  connect_timeout: "${POSTGRES_CONNECT_TIMEOUT:5}"   # 建连超时（秒），数据库不可达时快速失败

storage:
  endpoint: "${MINIO_ENDPOINT:127.0.0.1:9000}"   # MinIO 地址（host:port）
  bucket: "${MINIO_BUCKET:douyin-media}"         # 存储桶名
  region: "${MINIO_REGION:}"                     # 可选区域
  secure: "${MINIO_SECURE:false}"                # 是否走 HTTPS

# ── 邮件（口令留环境变量）───────────────────────────────────────────────
email:
  smtp_host: "${SMTP_HOST:}"                 # 为空时邮件功能不可用
  smtp_port: "${SMTP_PORT:587}"              # SMTP 端口
  smtp_user: "${SMTP_USER:}"                 # SMTP 登录名
  smtp_tls: "${SMTP_TLS:true}"               # 是否 STARTTLS
  smtp_ssl: "${SMTP_SSL:false}"              # 是否直连 SSL
  from_email: "${EMAILS_FROM_EMAIL:}"        # 发件人邮箱
  from_name: "${EMAILS_FROM_NAME:}"          # 发件人名称；留空回落到项目名
  reset_token_expire_hours: "${EMAIL_RESET_TOKEN_EXPIRE_HOURS:48}"   # 重置密码令牌有效期
  test_user: "${EMAIL_TEST_USER:test@example.com}"   # 测试用收件人

# ── MCP 网关（口令留环境变量）───────────────────────────────────────────
mcp:
  api_base_url: "${MCP_API_BASE_URL:http://127.0.0.1:8000/api/v1}"   # MCP 调用的后端地址
  api_username: "${MCP_API_USERNAME:}"       # MCP 登录后端用的账号

# ── 浏览器 ────────────────────────────────────────────────────────────────
browser:
  # DOUYIN_BROWSER_MODE：任务未显式指定浏览器模式时的默认值
  default_mode: remote

  # 本机 CDP 浏览器运行参数
  local:
    host: 127.0.0.1                       # DOUYIN_CDP_HOST
    port: 9222                            # DOUYIN_CDP_PORT
    connect_existing: false               # DOUYIN_CDP_CONNECT_EXISTING
    connect_timeout: 60                   # DOUYIN_CDP_CONNECT_TIMEOUT
    browser_path: ""                      # DOUYIN_CDP_BROWSER_PATH，空串表示自动探测
    user_data_dir: browser_data/douyin    # DOUYIN_CDP_USER_DATA_DIR（相对仓库根）
    headless: false                       # DOUYIN_CDP_HEADLESS
    auto_close: true                      # DOUYIN_CDP_AUTO_CLOSE
    # 本机槽位派生规则（config.yaml 的 browser.slots.local 非空时以槽位声明为准）
    slot_count: 4                         # DOUYIN_LOCAL_CDP_SLOT_COUNT
    port_base: 9333                       # DOUYIN_LOCAL_CDP_PORT_BASE
    slot_user_data_dir: browser_data/douyin-local   # DOUYIN_LOCAL_CDP_USER_DATA_DIR

  # 远程（容器）浏览器：DOUYIN_REMOTE_*
  remote:
    host: douyin-browser                  # DOUYIN_REMOTE_CDP_HOST
    port: 9222                            # DOUYIN_REMOTE_CDP_PORT
    viewer_url: "http://127.0.0.1:6081/vnc.html?autoconnect=1&resize=scale"   # DOUYIN_REMOTE_VIEWER_URL
    # 兼容项：旧的远程槽位 JSON（留空则使用上面的显式槽位声明或默认容器地址）
    legacy_slots_json: "${DOUYIN_REMOTE_CDP_SLOTS:}"

  # 显式槽位声明；留空（[]）时回落到上面的派生规则 / 旧的
  # DOUYIN_REMOTE_CDP_SLOTS（JSON，仍只从环境变量读取）。
  slots:
    # 示例：
    #   - {name: local-1, label: 本机浏览器 1, port: 9333, profile_dir: browser_data/douyin-local/local-1}
    #   - {name: local-2, label: 本机浏览器 2, port: 9334, enabled: false}
    local: []
    # 示例：
    #   - {name: pool-1, host: douyin-browser-1, port: 9222,
    #      viewer_url: "http://127.0.0.1:6082/vnc.html?autoconnect=1&resize=scale"}
    remote: []

# ── 账号登录会话 ──────────────────────────────────────────────────────────
account:
  login_session_ttl_seconds: 900          # DOUYIN_ACCOUNT_LOGIN_SESSION_TTL_SECONDS（60~3600）
  failure_cooldown_seconds: 0             # DOUYIN_ACCOUNT_FAILURE_COOLDOWN_SECONDS（已废弃，仅兼容）

# ── 采集请求 ──────────────────────────────────────────────────────────────
crawl:
  request_timeout: 60                     # DOUYIN_REQUEST_TIMEOUT
  request_ssl_verify: true                # DOUYIN_REQUEST_SSL_VERIFY
  login_timeout: 600                      # DOUYIN_LOGIN_TIMEOUT
  account_wait_poll_seconds: 2            # DOUYIN_ACCOUNT_WAIT_POLL_SECONDS（等账号调度容量的轮询间隔）

# ── 任务风控 ──────────────────────────────────────────────────────────────
risk_control:
  # 请求延迟档位 → 每次请求的随机间隔区间（秒）
  # 实际区间 = [max(档位下限, request_interval_seconds), max(档位上限, 下限 × 1.2)]
  # 档位名对应 API 契约里的 request_delay_level 枚举，新增档位需同步更新契约基线
  levels:
    fast: {interval_seconds: [1.0, 2.0]}
    steady: {interval_seconds: [3.0, 6.0]}
    ultra_steady: {interval_seconds: [6.0, 12.0]}
  # 服务端硬上限：超限的任务请求会被直接拒绝
  limits:
    max_active_tasks: 1                   # DOUYIN_MAX_ACTIVE_TASKS
    max_awemes_per_task: 1000             # DOUYIN_MAX_AWEMES_PER_TASK
    max_comments_per_aweme: 1000          # DOUYIN_MAX_COMMENTS_PER_AWEME

# ── 互动风控 ──────────────────────────────────────────────────────────────
interaction:
  daily_limit: 50                         # DOUYIN_INTERACTION_DAILY_LIMIT
  min_interval_seconds: 0                 # DOUYIN_INTERACTION_MIN_INTERVAL_SECONDS
  duplicate_window_hours: 24              # DOUYIN_INTERACTION_DUPLICATE_WINDOW_HOURS
  max_attempts: 3                         # DOUYIN_INTERACTION_MAX_ATTEMPTS
  navigation_attempts: 3                  # DOUYIN_INTERACTION_NAVIGATION_ATTEMPTS
  screenshots:
    enabled: true                         # DOUYIN_INTERACTION_SCREENSHOTS_ENABLED
    dir: data/interaction-screenshots     # DOUYIN_INTERACTION_SCREENSHOT_DIR（相对仓库根）
    quality: 65                           # DOUYIN_INTERACTION_SCREENSHOT_QUALITY（30~90）
    timeout_seconds: 5                    # DOUYIN_INTERACTION_SCREENSHOT_TIMEOUT_SECONDS
  timeouts:
    page_ready_seconds: 45                # DOUYIN_INTERACTION_PAGE_READY_TIMEOUT_SECONDS
    comment_ready_seconds: 30             # DOUYIN_INTERACTION_COMMENT_READY_TIMEOUT_SECONDS
    execution_seconds: 300                # DOUYIN_INTERACTION_EXECUTION_TIMEOUT_SECONDS

# ── 媒体下载与存储 ────────────────────────────────────────────────────────
media:
  storage_backend: minio                  # MEDIA_STORAGE_BACKEND（local / minio）
  output_dir: data/media                  # MEDIA_OUTPUT_DIR（相对仓库根）
  migration_concurrency: 4                # MEDIA_MIGRATION_CONCURRENCY
  preview_ttl_seconds: 300                # MEDIA_PREVIEW_TTL_SECONDS
  download:
    timeout: 180                          # MEDIA_DOWNLOAD_TIMEOUT
    retries: 3                            # MEDIA_DOWNLOAD_RETRIES
    # 独立于浏览器风控并发；沿用原 .env 的 2（代码默认是 4，可按机器带宽调大）
    concurrency: 2                        # MEDIA_DOWNLOAD_CONCURRENCY
    max_size_mb: 500                      # MEDIA_MAX_SIZE_MB
  # 仅字幕任务：只为了转字幕，不必把整段视频拉下来
  subtitle:
    # 优先下载作品「原声」音频（通常 1~10MB，且不需要 FFmpeg）。
    # 只有能确认是原声时才走音频，判不出来就照旧下视频，宁可慢也不出错。
    prefer_audio: true                    # MEDIA_SUBTITLE_PREFER_AUDIO
    # 仅字幕任务的大小上限（MB）；0 表示沿用 media.download.max_size_mb。
    # 直播回放/长合集这类动辄 1~2GB 又没有原声的作品，只能整段下载。
    max_size_mb: 2048                     # MEDIA_SUBTITLE_MAX_SIZE_MB
    # 仅字幕任务的单次下载超时（秒）；0 表示沿用 media.download.timeout。
    # 2GB 的大文件按 2MB/s 算要十几分钟，默认 180 秒下不完就会一直卡在重试。
    download_timeout: 900                 # MEDIA_SUBTITLE_DOWNLOAD_TIMEOUT
    # 仅字幕任务的下载尝试次数；0 表示沿用 media.download.retries。
    # 抖音 CDN 会在大文件传输中途掐断连接，每次尝试都从断点续传，
    # 3 次往往凑不满一个 2GB 文件，这里放宽到 8 次（连续两次零进展才放弃）。
    download_attempts: 8                  # MEDIA_SUBTITLE_DOWNLOAD_ATTEMPTS
  # 下载/转写失败后的退避：第 n 次重试等待 min(base_seconds × multiplier^(n-1), max_seconds)
  retry_backoff:
    base_seconds: 2                       # MEDIA_RETRY_BACKOFF_BASE_SECONDS
    multiplier: 2                         # MEDIA_RETRY_BACKOFF_MULTIPLIER
    max_seconds: 5                        # MEDIA_RETRY_BACKOFF_MAX_SECONDS

# ── 字幕转写与音频预处理（API Key 仍只从环境变量读取）────────────────────
subtitle:
  base_url: "http://127.0.0.1:9000"       # WHISPER_API_BASE_URL
  model: whisper-1                        # WHISPER_API_MODEL
  model_version: ""                       # WHISPER_API_MODEL_VERSION
  # 单次转写请求超时（秒）。CPU 版 faster-whisper 实测约 2.4 倍音频时长的耗时
  # （并发 8 时更慢：12 分钟音频要跑 29 分钟），1800 秒会让 10 分钟以上的音频全部
  # 撞超时线失败。直播回放类的音频可长达 2.5 小时、转写要 3 小时以上，故放宽到 6 小时。
  timeout: 21600                          # WHISPER_API_TIMEOUT
  trust_env: false                        # WHISPER_API_TRUST_ENV
  concurrency: 8                          # WHISPER_API_CONCURRENCY（字幕转写并发，仅字幕任务同样适用）
  audio_bitrate_kbps: 64                  # WHISPER_AUDIO_BITRATE_KBPS
  audio_preprocess_timeout: 300           # WHISPER_AUDIO_PREPROCESS_TIMEOUT
  ffmpeg_binary: ffmpeg                   # FFMPEG_BINARY

# ── 前端展示文案 ──────────────────────────────────────────────────────────
# 前端先用内置默认文案渲染，再按 GET /douyin/ui-labels 的结果覆盖；
# 接口不可用、缺键都不影响页面可用。键必须落在 API 契约的枚举值内（有测试兜底）。
ui:
  labels:
    account_status:
      login_required: 待登录
      verifying: 待验证
      ready: 可用
      busy: 执行中
      cooldown: 冷却中
      unhealthy: 异常
      disabled: 已停用
