services:
  douyin-browser:
    image: mediacrawler-dy/browser:local
    build:
      context: ./docker/browser
      dockerfile: Dockerfile
    restart: always
    shm_size: 2gb
    # Docker Desktop may inject the host proxy as 127.0.0.1. Inside the
    # container that address points back to the container and breaks Chrome.
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    volumes:
      - douyin-browser-profile:/profile
    # CDP and noVNC are intentionally loopback-only. Containers use the
    # internal douyin-browser:9222 endpoint instead of the published port.
    ports:
      - "127.0.0.1:9223:9222"
      - "127.0.0.1:6081:6080"
    networks:
      - default

  backend:
    environment:
      DOUYIN_BROWSER_MODE: remote
      DOUYIN_REMOTE_CDP_HOST: douyin-browser
      DOUYIN_REMOTE_CDP_PORT: "9222"
    depends_on:
      douyin-browser:
        condition: service_healthy

volumes:
  douyin-browser-profile:
